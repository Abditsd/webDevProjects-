<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f0f4f8" />
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="80" fill="#ff6b00" opacity="0.2" />
  <circle cx="500" cy="300" r="100" fill="#ff6b00" opacity="0.1" />
  
  <!-- Stack of Books -->
  <rect x="150" y="250" width="300" height="40" rx="5" ry="5" fill="#333" />
  <rect x="170" y="210" width="300" height="40" rx="5" ry="5" fill="#555" />
  <rect x="190" y="170" width="300" height="40" rx="5" ry="5" fill="#777" />
  
  <!-- Main Book -->
  <rect x="150" y="50" width="300" height="120" rx="5" ry="5" fill="#ff6b00" />
  <rect x="160" y="60" width="280" height="100" rx="3" ry="3" fill="white" />
  
  <!-- Text on Book -->
  <text x="200" y="110" font-family="Arial" font-size="24" font-weight="bold" fill="#333333">Oromo Language</text>
  <text x="200" y="140" font-family="Arial" font-size="18" fill="#666666">Culture & Heritage</text>
  
  <!-- Pen -->
  <rect x="400" y="80" width="15" height="150" rx="3" ry="3" fill="#333" transform="rotate(45, 400, 80)" />
  <polygon points="385,65 415,65 400,45" fill="#333" transform="rotate(45, 400, 80)" />
  
  <!-- Tablet/iPad -->
  <rect x="100" y="150" width="120" height="160" rx="10" ry="10" fill="#333" />
  <rect x="110" y="160" width="100" height="130" rx="5" ry="5" fill="#fff" />
  <circle cx="160" cy="300" r="8" fill="#666" />
  
  <!-- Text on Tablet -->
  <text x="130" y="200" font-family="Arial" font-size="12" fill="#ff6b00">Learn</text>
  <text x="130" y="220" font-family="Arial" font-size="12" fill="#ff6b00">Oromo</text>
  <line x1="130" y1="240" x2="190" y2="240" stroke="#ddd" stroke-width="2" />
  <line x1="130" y1="255" x2="180" y2="255" stroke="#ddd" stroke-width="2" />
  <line x1="130" y1="270" x2="170" y2="270" stroke="#ddd" stroke-width="2" />
</svg>