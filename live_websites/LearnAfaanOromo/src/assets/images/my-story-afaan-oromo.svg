<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="600" fill="#f8f9fa" rx="20" ry="20"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="150" r="100" fill="#e9ecef" opacity="0.5"/>
  <circle cx="450" cy="450" r="100" fill="#e9ecef" opacity="0.5"/>
  
  <!-- Main illustration - Person teaching/learning -->
  <g transform="translate(300, 300)">
    <!-- Teacher figure -->
    <g transform="translate(-100, 0)">
      <!-- Head -->
      <circle cx="0" cy="-70" r="40" fill="#ffb703" stroke="#333" stroke-width="2"/>
      
      <!-- Face -->
      <circle cx="-15" cy="-75" r="5" fill="#333"/> <!-- Left eye -->
      <circle cx="15" cy="-75" r="5" fill="#333"/> <!-- Right eye -->
      <path d="M-10,-55 Q0,-45 10,-55" stroke="#333" stroke-width="3" fill="none"/> <!-- Smile -->
      
      <!-- Body -->
      <path d="M0,-30 L0,80" stroke="#333" stroke-width="8" fill="none"/> <!-- Torso -->
      <path d="M0,0 L-60,30" stroke="#333" stroke-width="6" fill="none"/> <!-- Left arm -->
      <path d="M0,0 L60,-20" stroke="#333" stroke-width="6" fill="none"/> <!-- Right arm -->
      <path d="M60,-20 L100,10" stroke="#333" stroke-width="6" fill="none"/> <!-- Right forearm -->
      
      <!-- Legs -->
      <path d="M0,80 L-30,150" stroke="#333" stroke-width="8" fill="none"/> <!-- Left leg -->
      <path d="M0,80 L30,150" stroke="#333" stroke-width="8" fill="none"/> <!-- Right leg -->
    </g>
    
    <!-- Student figure -->
    <g transform="translate(100, 0)">
      <!-- Head -->
      <circle cx="0" cy="-70" r="35" fill="#fb8500" stroke="#333" stroke-width="2"/>
      
      <!-- Face -->
      <circle cx="-12" cy="-75" r="4" fill="#333"/> <!-- Left eye -->
      <circle cx="12" cy="-75" r="4" fill="#333"/> <!-- Right eye -->
      <path d="M-8,-55 Q0,-45 8,-55" stroke="#333" stroke-width="2.5" fill="none"/> <!-- Smile -->
      
      <!-- Body -->
      <path d="M0,-35 L0,70" stroke="#333" stroke-width="7" fill="none"/> <!-- Torso -->
      <path d="M0,-5 L-50,20" stroke="#333" stroke-width="5" fill="none"/> <!-- Left arm -->
      <path d="M0,-5 L50,20" stroke="#333" stroke-width="5" fill="none"/> <!-- Right arm -->
      
      <!-- Legs -->
      <path d="M0,70 L-25,140" stroke="#333" stroke-width="7" fill="none"/> <!-- Left leg -->
      <path d="M0,70 L25,140" stroke="#333" stroke-width="7" fill="none"/> <!-- Right leg -->
    </g>
  </g>
  
  <!-- Oromo language elements -->
  <g transform="translate(300, 150)">
    <!-- Title -->
    <text x="0" y="-50" font-family="Arial" font-weight="bold" font-size="28" fill="#333" text-anchor="middle">Afaan Oromo</text>
    
    <!-- Speech bubble from teacher to student -->
    <path d="M-80,0 Q0,-40 80,0 Q100,50 80,100 Q0,60 -80,100 Q-100,50 -80,0 Z" fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Oromo phrases in speech bubble -->
    <text x="0" y="-10" font-family="Arial" font-size="16" fill="#333" text-anchor="middle">Akkam jirta?</text>
    <text x="0" y="20" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">(How are you?)</text>
    <text x="0" y="50" font-family="Arial" font-size="16" fill="#333" text-anchor="middle">Nagaan</text>
    <text x="0" y="80" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">(Peace/I am fine)</text>
  </g>
  
  <!-- Cultural elements -->
  <g transform="translate(150, 450)">
    <!-- Traditional Oromo coffee ceremony -->
    <circle cx="0" cy="0" r="60" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/> <!-- Coffee pot base -->
    <path d="M-40,-20 Q0,-80 40,-20" fill="#5d4037" stroke="#3e2723" stroke-width="2"/> <!-- Coffee pot top -->
    <circle cx="-20" cy="10" r="15" fill="#3e2723"/> <!-- Coffee cup 1 -->
    <circle cx="20" cy="10" r="15" fill="#3e2723"/> <!-- Coffee cup 2 -->
  </g>
  
  <!-- Ethiopian/Oromo patterns -->
  <g transform="translate(450, 450)">
    <!-- Stylized traditional pattern -->
    <rect x="-50" y="-50" width="100" height="100" fill="#fff" stroke="#333" stroke-width="2"/>
    <path d="M-50,-50 L50,50 M50,-50 L-50,50" stroke="#ff6b00" stroke-width="3" fill="none"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#ff6b00" stroke-width="3"/>
    <rect x="-25" y="-25" width="50" height="50" fill="none" stroke="#ff6b00" stroke-width="3"/>
  </g>
  
  <!-- Bottom title -->
  <text x="300" y="550" font-family="Arial" font-weight="bold" font-size="24" fill="#ff6b00" text-anchor="middle">Learning Journey</text>
</svg>