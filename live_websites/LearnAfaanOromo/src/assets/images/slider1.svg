<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="500" fill="#f0f4f8" />
  
  <!-- Decorative Elements -->
  <circle cx="200" cy="150" r="100" fill="#ff6b00" opacity="0.2" />
  <circle cx="1000" cy="400" r="150" fill="#ff6b00" opacity="0.1" />
  
  <!-- Illustration: People Learning -->
  <rect x="700" y="100" width="300" height="200" rx="10" ry="10" fill="#ff6b00" />
  <rect x="720" y="120" width="260" height="160" rx="5" ry="5" fill="white" />
  
  <!-- Person -->
  <circle cx="300" cy="250" r="50" fill="#333" />
  <rect x="250" y="300" width="100" height="150" rx="10" ry="10" fill="#333" />
  
  <!-- Text: Learn Oromo -->
  <text x="150" y="150" font-family="Arial" font-size="60" font-weight="bold" fill="#333333">Discover the</text>
  <text x="150" y="220" font-family="Arial" font-size="60" font-weight="bold" fill="#ff6b00">Oromo Language</text>
  <text x="150" y="280" font-family="Arial" font-size="30" fill="#666666">Start your journey to fluency today</text>
</svg>