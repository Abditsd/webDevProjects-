<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="600" fill="#f8f9fa" rx="20" ry="20"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="#e9ecef" opacity="0.7"/>
  <circle cx="500" cy="500" r="80" fill="#e9ecef" opacity="0.7"/>
  
  <!-- Stack of books -->
  <g transform="translate(300, 400) scale(1.2)">
    <!-- Book 1 -->
    <rect x="-120" y="-30" width="240" height="40" rx="5" ry="5" fill="#4361ee" stroke="#2b4acb" stroke-width="2"/>
    <rect x="-110" y="-30" width="220" height="5" rx="2" ry="2" fill="#2b4acb"/>
    <text x="0" y="-5" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Oromo Language</text>
    
    <!-- Book 2 -->
    <rect x="-110" y="-60" width="220" height="30" rx="5" ry="5" fill="#3a86ff" stroke="#2a66cf" stroke-width="2"/>
    <rect x="-100" y="-60" width="200" height="5" rx="2" ry="2" fill="#2a66cf"/>
    <text x="0" y="-40" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Grammar</text>
    
    <!-- Book 3 -->
    <rect x="-130" y="-85" width="200" height="25" rx="5" ry="5" fill="#4cc9f0" stroke="#2a9ec0" stroke-width="2"/>
    <rect x="-120" y="-85" width="180" height="5" rx="2" ry="2" fill="#2a9ec0"/>
    <text x="-30" y="-70" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Vocabulary</text>
    
    <!-- Book 4 -->
    <rect x="-100" y="-105" width="180" height="20" rx="5" ry="5" fill="#f72585" stroke="#c01a69" stroke-width="2"/>
    <rect x="-90" y="-105" width="160" height="4" rx="2" ry="2" fill="#c01a69"/>
    <text x="-10" y="-92" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Culture</text>
  </g>
  
  <!-- Person studying -->
  <g transform="translate(300, 250)">
    <!-- Head -->
    <circle cx="0" cy="-70" r="40" fill="#ffb703" stroke="#333" stroke-width="2"/>
    
    <!-- Face -->
    <circle cx="-15" cy="-75" r="5" fill="#333"/> <!-- Left eye -->
    <circle cx="15" cy="-75" r="5" fill="#333"/> <!-- Right eye -->
    <path d="M-10,-55 Q0,-45 10,-55" stroke="#333" stroke-width="3" fill="none"/> <!-- Smile -->
    
    <!-- Body -->
    <path d="M0,-30 L0,50" stroke="#333" stroke-width="8" fill="none"/> <!-- Torso -->
    <path d="M0,0 L-60,-20" stroke="#333" stroke-width="6" fill="none"/> <!-- Left arm -->
    <path d="M-60,-20 L-90,10" stroke="#333" stroke-width="6" fill="none"/> <!-- Left forearm -->
    <path d="M0,0 L60,-30" stroke="#333" stroke-width="6" fill="none"/> <!-- Right arm -->
    <path d="M60,-30 L100,-10" stroke="#333" stroke-width="6" fill="none"/> <!-- Right forearm -->
    
    <!-- Legs -->
    <path d="M0,50 L-30,120" stroke="#333" stroke-width="8" fill="none"/> <!-- Left leg -->
    <path d="M0,50 L30,120" stroke="#333" stroke-width="8" fill="none"/> <!-- Right leg -->
    
    <!-- Book in hands -->
    <rect x="-90" y="10" width="60" height="40" rx="5" ry="5" fill="#fb8500" stroke="#333" stroke-width="2" transform="rotate(-10)"/>
    <rect x="-85" y="20" width="50" height="5" fill="#333" transform="rotate(-10)"/>
    <rect x="-85" y="30" width="50" height="5" fill="#333" transform="rotate(-10)"/>
    <rect x="-85" y="40" width="30" height="5" fill="#333" transform="rotate(-10)"/>
  </g>
  
  <!-- Thought bubbles -->
  <g transform="translate(180, 100)">
    <circle cx="0" cy="0" r="30" fill="white" stroke="#333" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial" font-size="20" fill="#333" text-anchor="middle">አ</text>
  </g>
  
  <g transform="translate(250, 70)">
    <circle cx="0" cy="0" r="25" fill="white" stroke="#333" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial" font-size="18" fill="#333" text-anchor="middle">ብ</text>
  </g>
  
  <g transform="translate(320, 50)">
    <circle cx="0" cy="0" r="35" fill="white" stroke="#333" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial" font-size="22" fill="#333" text-anchor="middle">ሃ</text>
  </g>
  
  <g transform="translate(400, 80)">
    <circle cx="0" cy="0" r="28" fill="white" stroke="#333" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial" font-size="19" fill="#333" text-anchor="middle">ሰ</text>
  </g>
  
  <!-- Connection lines between thought bubbles -->
  <path d="M190,120 L230,90" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M270,80 L300,65" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M350,60 L380,70" stroke="#333" stroke-width="2" fill="none"/>
  
  <!-- Title -->
  <text x="300" y="550" font-family="Arial" font-weight="bold" font-size="24" fill="#333" text-anchor="middle">Learning Oromo</text>
</svg>